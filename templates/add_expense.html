{% extends "base.html" %}

{% block title %}{{ heading }} — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">{{ heading }}</h1>
            <p class="auth-subtitle">{{ subtitle }}</p>
        </div>

        <div class="auth-card">
            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="auth-{{ category }}">{{ message }}</div>
            {% endfor %}

            <form method="POST" action="{{ form_action }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" placeholder="0.00"
                           step="0.01" min="0.01" max="{{ max_amount }}"
                           value="{{ form.amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled{% if not form.category %} selected{% endif %}>Choose a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}"{% if form.category == cat %} selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" value="{{ form.date }}" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Lunch with friends"
                           maxlength="{{ max_description }}" value="{{ form.description }}">
                </div>
                <button type="submit" class="btn-submit">{{ submit_label }}</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel</a>
        </p>

    </div>
</section>

{% endblock %}
